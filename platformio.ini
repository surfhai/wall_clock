; PlatformIO project configuration — DIY e-paper wall clock (ESP32-S3)
; See CLAUDE.md for all architecture/hardware decisions.

[platformio]
; Optional local overrides, see wifi_defaults.ini.example. Glob pattern so
; it's not an error when wifi_defaults.ini doesn't exist (fresh checkout).
extra_configs = wifi_defaults*.ini

[wifi_defaults]
; Empty fallback so ${wifi_defaults.build_flags} below never fails to
; resolve when wifi_defaults.ini isn't present. If it is present, its own
; [wifi_defaults] section (see wifi_defaults.ini.example) is merged in
; instead/in addition.
build_flags =

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    ; Europe/Berlin timezone (CET/CEST) for configTzTime() in net_time.cpp
    -D TZ_INFO=\"CET-1CEST,M3.5.0,M10.5.0/3\"

    ; TODO: if the XIAO ESP32-S3 is the "Sense" variant with 8 MB PSRAM,
    ; enable the line below and use GxEPD2 in full-buffer mode (see display.h).
    ; Without PSRAM: leave commented out -> GxEPD2 paged mode is used.
    ; -D BOARD_HAS_PSRAM
    ; -mfix-esp32-psram-cache-issue

    ; TODO: Bluetooth is not active by default in the Arduino framework as
    ; long as no BluetoothSerial/BLE headers are included - no further
    ; action needed. If it does get included: don't use it (see CLAUDE.md
    ; section 5).

    ; OPTIONAL (CLAUDE.md section 5a "default credentials at flash time"):
    ; bootstrap NVS with default WiFi credentials on first boot so initial
    ; commissioning can skip the WiFiManager captive portal. Values come
    ; from the local, gitignored wifi_defaults.ini (see
    ; wifi_defaults.ini.example and the [wifi_defaults] section above) -
    ; empty/absent by default, so this is a no-op until that file has real
    ; credentials (still an open decision whether to use it at all, see
    ; CLAUDE.md section 10).
    ${wifi_defaults.build_flags}

; Additionally needed for PSRAM boards (Sense variant), see TODO above:
; board_build.arduino.memory_type = qio_opi

lib_deps =
    ; Display: GxEPD2 (https://github.com/ZinggJM/GxEPD2)
    zinggjm/GxEPD2 @ ^1.6.1
    ; required by GxEPD2 for font rendering
    adafruit/Adafruit GFX Library @ ^1.11.9
    ; PCF8563 RTC (onboard expansion board)
    adafruit/RTClib @ ^2.1.4
    ; WiFi provisioning via captive portal, see CLAUDE.md section 5a
    tzapu/WiFiManager @ ^2.0.17

    ; TODO: sensor library depending on the final sensor choice (see
    ; CLAUDE.md section 2/10) - enable exactly one of the following lines
    ; and set SENSOR_TYPE in config.h accordingly:
    ; adafruit/Adafruit SHT4x Library @ ^1.0.4
    ; adafruit/Adafruit SHT31 Library @ ^2.2.2
    ; adafruit/Adafruit AHT20 @ ^1.0.5

    ; Also needed for the Adafruit sensor libraries above:
    ; adafruit/Adafruit Unified Sensor @ ^1.1.14
    ; adafruit/Adafruit BusIO @ ^1.16.1

; Debug build (USB-CDC/JTAG active, serial output) - the only environment.
;
; A separate release env (build_type=release, -D ARDUINO_USB_CDC_ON_BOOT=0)
; was tried and deliberately reverted: the XIAO ESP32-S3 has no separate
; USB-UART bridge chip, so disabling USB-CDC silences ALL Serial debug
; output completely (rtc.cpp/net_time.cpp/sensor.cpp/power.cpp/main.cpp all
; log heavily) and also breaks the normal one-command `pio run -t upload`
; auto-reset (needs an active CDC connection to reset the board into the
; bootloader) - you'd have to manually hold BOOT+RESET to reflash. Also,
; most of the "disable for release" wishlist in CLAUDE.md section 5
; (Bluetooth, ADC calibration, touch, CAN, DAC) turned out to not be
; reachable at all from this prebuilt-Arduino-framework build (those are
; ESP-IDF sdkconfig options baked into precompiled libs, not build_flags).
; Given the project isn't at real battery operation yet (DEEP_SLEEP_ENABLED
; is still 0), the tradeoff wasn't worth it - revisit once battery
; operation is actually being tested (see CLAUDE.md section 5/10).
build_type = debug
